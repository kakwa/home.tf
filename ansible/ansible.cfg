# Run from ansible/ e.g. ansible-playbook hypervisor.yml
# The inventory is the `inventory/` directory: every *.yml file in it is
# merged (one file per pool), including `infra.yml`, which OpenTofu
# (tofu/infra) generates.
# Override with -i for one-off hosts or the Terraform-generated inventory:
#   ansible-playbook -i "$HOSTNAME," bootstrap.yml
#   ansible-playbook -i ../terraform/inventory.yml utility.yml
[defaults]
inventory = inventory
roles_path = roles:external/ansible/roles
