---
# Bootstrap a fresh Debian/Ubuntu host for Ansible without Python on the target.
#
# Only `raw` (and `script`) work before Python is installed, so fact gathering
# is disabled and every remote action is a shell command sent over SSH.
#
# Usage with the default inventory (applies the host's NIC -> IP mapping):
#   ansible-playbook --limit ai bootstrap.yml
#
# First-time login with a password (requires sshpass locally):
#   ansible-playbook -k -K --limit ai bootstrap.yml
#
# Ad-hoc host, reusing a host's NIC -> IP mapping from the inventory:
#   ansible-playbook -i "$HOST," --limit "$HOST" \
#     -e ansible_user="$LOGIN" -e bootstrap_inventory_host=ai bootstrap.yml
#
# Override elevation detection (e.g. sudo with a password):
#   ... -e bootstrap_become_method=sudo -e bootstrap_become_password=...

- name: Detect elevation method and validate inputs
  hosts: all
  gather_facts: false
  vars:
    bootstrap_login: "{{ ansible_user | default(lookup('env', 'USER')) }}"
    bootstrap_ssh_key_path: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519.pub"
    bootstrap_ssh_key: "{{ lookup('file', bootstrap_ssh_key_path, errors='ignore') | trim }}"
    # Leave empty to auto-detect: use passwordless sudo when available, else su.
    bootstrap_become_method: ""
  tasks:
    - name: Validate login name
      ansible.builtin.assert:
        that:
          - bootstrap_login is match('^[a-zA-Z_][a-zA-Z0-9_.-]*$')
        fail_msg: "Invalid remote login name: {{ bootstrap_login }}"

    - name: Validate SSH public key
      ansible.builtin.assert:
        that:
          - bootstrap_ssh_key | length > 0
        fail_msg: "No SSH public key found at {{ bootstrap_ssh_key_path }}"

    - name: Check for passwordless sudo
      ansible.builtin.raw: >-
        command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1
        && echo passwordless-sudo || echo su
      register: bootstrap_elevation
      changed_when: false
      args:
        warn: false

    - name: Select become method for subsequent plays
      ansible.builtin.set_fact:
        ansible_become_method: >-
          {{ bootstrap_become_method if bootstrap_become_method | length > 0
             else ('sudo' if bootstrap_elevation.stdout | trim == 'passwordless-sudo' else 'su') }}

- name: Install packages, configure sudo and deploy the SSH key
  hosts: all
  gather_facts: false
  become: true
  vars:
    bootstrap_login: "{{ ansible_user | default(lookup('env', 'USER')) }}"
    bootstrap_ssh_key_path: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519.pub"
    bootstrap_ssh_key: "{{ lookup('file', bootstrap_ssh_key_path, errors='ignore') | trim }}"
  tasks:
    - name: Install sudo, Python and the apt Python bindings
      ansible.builtin.raw: |
        if ! command -v python3 >/dev/null 2>&1 \
           || ! command -v sudo >/dev/null 2>&1 \
           || ! dpkg -s python3-apt >/dev/null 2>&1 \
           || ! dpkg -s python3-debian >/dev/null 2>&1; then
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y sudo python3 python3-apt python3-debian
        fi
      args:
        warn: false

    # No `usermod` here: minimal images may not ship shadow-utils. The
    # sudoers drop-in alone grants passwordless sudo.
    - name: Configure passwordless sudo for the login
      ansible.builtin.raw: |
        sudoers_file=/etc/sudoers.d/'{{ bootstrap_login }}'
        sudoers_line='{{ bootstrap_login }} ALL=(ALL:ALL) NOPASSWD: ALL'
        mkdir -p /etc/sudoers.d
        if [ ! -f "$sudoers_file" ] || ! grep -qxF "$sudoers_line" "$sudoers_file"; then
          printf '%s\n' "$sudoers_line" > "$sudoers_file"
          chmod 440 "$sudoers_file"
        fi
      args:
        warn: false

    - name: Deploy the SSH public key
      ansible.builtin.raw: |
        ssh_dir=/home/'{{ bootstrap_login }}'/.ssh
        auth_keys="$ssh_dir/authorized_keys"
        install -d -m 700 -o '{{ bootstrap_login }}' -g '{{ bootstrap_login }}' "$ssh_dir"
        if [ ! -f "$auth_keys" ] || ! grep -qxF '{{ bootstrap_ssh_key }}' "$auth_keys"; then
          printf '%s\n' '{{ bootstrap_ssh_key }}' >> "$auth_keys"
        fi
        chown '{{ bootstrap_login }}:{{ bootstrap_login }}' "$auth_keys"
        chmod 600 "$auth_keys"
      args:
        warn: false

    - name: Pin the Python interpreter for later plays
      ansible.builtin.set_fact:
        ansible_python_interpreter: /usr/bin/python3

    - name: Show next step
      ansible.builtin.debug:
        msg: "Bootstrap complete - applying the inventory static IP mapping (if any)"

# Python now exists, so the normal module-based role can run. Hosts without a
# `static_ip_nics` mapping (e.g. ad-hoc `-i host,` runs) are skipped by the role.
- name: Apply the static IP mapping from the inventory
  hosts: all
  gather_facts: false
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
  pre_tasks:
    # For ad-hoc `-i "$HOST,"` runs: reuse the mapping of a host defined in
    # inventory.yml instead of duplicating NIC/IP settings on the CLI. Pass
    # both inventories and `-e bootstrap_inventory_host=ai`.
    - name: Validate the inventory host name
      ansible.builtin.assert:
        that:
          - bootstrap_inventory_host in hostvars
          - hostvars[bootstrap_inventory_host].static_ip_nics is defined
        fail_msg: >-
          No host '{{ bootstrap_inventory_host }}' with static_ip_nics in the
          inventory. Add the inventory directory as a second -i source.
      when: bootstrap_inventory_host | default('') | length > 0

    - name: Reuse the named host's NIC -> IP mapping
      ansible.builtin.set_fact:
        static_ip_nics: "{{ hostvars[bootstrap_inventory_host].static_ip_nics }}"
      when: bootstrap_inventory_host | default('') | length > 0
  roles:
    - role: static_ip
      tags: ["network", "static_ip"]
