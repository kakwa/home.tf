---
- name: Hypervisor Server Setup
  hosts: all
  become: true
  # The external repos role uses deb822_repository; allow it to install its
  # python3-debian requirement automatically if a host is missing it.
  module_defaults:
    ansible.builtin.deb822_repository:
      install_python_debian: true
  vars:
    avahi_hostname: "kvm"
    avahi_additional_hostnames: []
  pre_tasks:
    # The PVE installer can leave an enterprise .sources file with all fields
    # commented out except Enabled, which apt considers a malformed stanza.
    # Neutralize it before any role runs apt.
    - name: Check for PVE enterprise deb822 source
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/pve-enterprise.sources
      register: pve_enterprise_precheck

    - name: Disable PVE enterprise source before apt runs
      ansible.builtin.replace:
        path: /etc/apt/sources.list.d/pve-enterprise.sources
        regexp: '^\s*([A-Za-z][A-Za-z0-9-]*):'
        replace: '# \1:'
      when:
        - pve_enterprise_precheck.stat.exists
        - pve_disable_enterprise_repo | default(true) | bool
  roles:
    - { role: os_config, tags: ["system", "os_config"] }
    - { role: users, tags: ["system", "os_config"] }
    - { role: misc-base, tags: ["system", "misc-base"] }
    - { role: root_ssh, tags: ["system", "ssh"] }
    - { role: avahi, tags: ["system", "network", "avahi"] }
    - { role: vim, tags: ["system", "vim"] }
    - { role: zsh, tags: ["system", "zsh"] }
    - { role: proxmox, tags: ["hypervisor", "virtualization", "proxmox"] }
    - { role: proxmox_pools, tags: ["hypervisor", "virtualization", "proxmox", "proxmox-pools"] }
