---
# Ansible master VM: base tooling for the Ansible control node + OVH DNS-01
# certbot handler holding a wildcard cert for int.kakwalab.ovh.
# Targets the `infra_ansible_master` group of the OpenTofu-generated inventory
# (inventory/infra.yml, generated by tofu/infra).
#
# OVH API credentials are the same ones used by utility.yml: set the vault_*
# variables or drop the three tokens in ansible/ovh_dns_*.txt (gitignored).
#
# Note: the `users` role is intentionally not applied here; the infra VMs are
# provisioned by cloud-init with `kakwa` (uid 1000), while the role would
# renumber it to 1001.
- name: Ansible Master VM Setup
  hosts: infra_ansible_master
  become: true
  # The external repos role uses deb822_repository; allow it to install its
  # python3-debian requirement automatically if a host is missing it.
  module_defaults:
    ansible.builtin.deb822_repository:
      install_python_debian: true
  vars:
    certbot_letsencrypt_enable: true
    # Live cert directory is named after the cert_name (first -d).
    certbot_letsencrypt_cert_name: "int.kakwalab.ovh"
    # Wildcard covers only subdomains, so include the bare domain as well.
    certbot_letsencrypt_domains:
      - "int.kakwalab.ovh"
      - "*.int.kakwalab.ovh"
  roles:
    - { role: os_config, tags: ["system", "os_config"] }
    - { role: repos, tags: ["system", "repos"] }
    - { role: misc-base, tags: ["system", "misc-base"] }
    - { role: vim, tags: ["system", "vim"] }
    - { role: zsh, tags: ["system", "zsh"] }
    - { role: hosts_entries, tags: ["system", "hosts"] }
    - role: certbot_letsencrypt
      tags: ["infra", "ansible-master", "certbot", "letsencrypt"]
      vars:
        certbot_letsencrypt_email: "{{ vault_letsencrypt_email | default('hostmaster@kakwalab.ovh') }}"
        certbot_letsencrypt_ovh_application_key: "{{ vault_docker_registry_ovh_application_key | default(lookup('file', playbook_dir ~ '/ovh_dns_application_key.txt') | trim, true) }}"
        certbot_letsencrypt_ovh_application_secret: "{{ vault_docker_registry_ovh_application_secret | default(lookup('file', playbook_dir ~ '/ovh_dns_application_secret.txt') | trim, true) }}"
        certbot_letsencrypt_ovh_consumer_key: "{{ vault_docker_registry_ovh_consumer_key | default(lookup('file', playbook_dir ~ '/ovh_dns_consumer_key.txt') | trim, true) }}"
