---
# DNS VM: base roles + BIND (authoritative for int.kakwalab.ovh with TSIG
# dynamic updates, recursive resolver for the LAN, adblock via RPZ) +
# dnscherry (web UI behind nginx, LDAP auth).
# Targets the `infra_dns` group of the OpenTofu-generated inventory
# (inventory/infra.yml, generated by tofu/infra).
#
# TSIG secret: set vault_bind_dns_tsig_secret or drop the base64 secret in
# ansible/dns_tsig_secret.txt (gitignored). Keep it in sync with
# tofu/infra/dns.auto.tfvars.json (dns_tsig_key_secret).
#
# openldap_admin_password is resolved here (same file as infra-ldap.yml) so
# dnscherry can reuse the LDAP admin password for its bind account.
- name: DNS VM Setup
  hosts: infra_dns
  become: true
  # The external repos role uses deb822_repository; allow it to install its
  # python3-debian requirement automatically if a host is missing it.
  module_defaults:
    ansible.builtin.deb822_repository:
      install_python_debian: true
  vars:
    # The openldap role is not applied on the DNS VM; set the vars dnscherry's
    # modLdap auth needs explicitly (same values as infra-ldap.yml).
    openldap_domain: "kakwalab.ovh"
    openldap_base_dn: "dc=kakwalab,dc=ovh"
    openldap_admin_password: "{{ vault_openldap_admin_password | default(lookup('password', playbook_dir ~ '/openldap_admin.password.txt chars=ascii_letters,digits length=24') | trim, true) }}"
  roles:
    - { role: os_config, tags: ["system", "os_config"] }
    - { role: repos, tags: ["system", "repos"] }
    - { role: misc-base, tags: ["system", "misc-base"] }
    - { role: vim, tags: ["system", "vim"] }
    - { role: zsh, tags: ["system", "zsh"] }
    - { role: hosts_entries, tags: ["system", "hosts"] }
    - role: bind_dns
      tags: ["infra", "dns", "bind_dns"]
      vars:
        bind_dns_tsig_secret: "{{ vault_bind_dns_tsig_secret | default(lookup('file', playbook_dir ~ '/dns_tsig_secret.txt') | trim, true) }}"
    - role: dnscherry
      tags: ["infra", "dns", "dnscherry"]
      vars:
        bind_dns_tsig_secret: "{{ vault_bind_dns_tsig_secret | default(lookup('file', playbook_dir ~ '/dns_tsig_secret.txt') | trim, true) }}"
        dnscherry_nginx_ssl_letsencrypt: false
