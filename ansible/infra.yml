---
# Infra pool VMs: one play for all four pool hosts (dns, ldap, ansible-master,
# registry), differentiated by the group each host belongs to in the
# OpenTofu-generated inventory (inventory/infra.yml, generated by tofu/infra).
#
#   infra_dns            → base roles + BIND (authoritative for int.kakwalab.ovh
#                          with TSIG dynamic updates, recursive resolver for the
#                          LAN, adblock via RPZ) + dnscherry (web UI behind
#                          nginx, LDAP auth)
#   infra_ldap           → base roles + OpenLDAP + ldapcherry (nginx reverse
#                          proxy, self-signed TLS — no certbot on this VM) +
#                          SSH-via-LDAP (nslcd)
#   infra_ansible_master → base roles (Ansible control node) + certbot (OVH
#                          DNS-01) holding the wildcard cert for
#                          int.kakwalab.ovh + *.int.kakwalab.ovh
#   infra_registry       → base roles + certbot (OVH DNS-01) for
#                          registry.int.kakwalab.ovh + docker-registry (nginx,
#                          Let's Encrypt TLS, HTTP basic auth)
#
# The `users` role is intentionally not applied anywhere in this play: the
# infra VMs are provisioned by cloud-init with `kakwa` (uid 1000), while the
# role would renumber it to 1001.
#
# TSIG secret: set vault_bind_dns_tsig_secret or drop the base64 secret in
# ansible/dns_tsig_secret.txt (gitignored). Keep it in sync with
# tofu/infra/dns.auto.tfvars.json (dns_tsig_key_secret).
#
# OVH API credentials are the same ones used by utility.yml: set the vault_*
# variables or drop the three tokens in ansible/ovh_dns_*.txt (gitignored).
#
# OpenLDAP secrets live at PLAY level (not in the openldap role's vars) so
# every role in this play that needs them — openldap AND ssh_ldap (both on the
# LDAP VM) AND dnscherry (on the DNS VM, for its LDAP bind account) — resolves
# the same cached value. (Role-level vars are scoped to that role; ssh_ldap
# otherwise fell back to its "changeme-readonly" default and its LDAPS bind
# failed with "Invalid credentials".) The lookup() caches into the gitignored
# .password.txt files next to this playbook, so re-running on either VM reuses
# the same secret.
# Bootstrap must run before facts are gathered (Python may not exist yet).
# The role's marker makes this a no-op on already bootstrapped hosts.
- name: Bootstrap hosts that are not ready for Ansible yet
  hosts: infra_dns:infra_ldap:infra_ansible_master:infra_registry
  gather_facts: false
  become: false
  roles:
    - role: bootstrap
      tags: ["system", "bootstrap"]

- name: Infra VM Setup
  hosts: infra_dns:infra_ldap:infra_ansible_master:infra_registry
  become: true
  # The external repos role uses deb822_repository; allow it to install its
  # python3-debian requirement automatically if a host is missing it.
  module_defaults:
    ansible.builtin.deb822_repository:
      install_python_debian: true
  vars:
    # Shared OpenLDAP settings: the openldap role only runs on the LDAP VM, but
    # dnscherry (DNS VM) and the registry need the domain/base DN for their
    # LDAP integration — set the values explicitly here (same values as the
    # openldap role's defaults).
    openldap_domain: "kakwalab.ovh"
    openldap_fqdn: "ldap.int.{{ openldap_domain }}"
    openldap_base_dn: "dc=kakwalab,dc=ovh"
    openldap_admin_password: "{{ vault_openldap_admin_password | default(lookup('password', playbook_dir ~ '/openldap_admin.password.txt chars=ascii_letters,digits length=24') | trim, true) }}"
    openldap_breakglass_password: "{{ vault_openldap_breakglass_password | default(lookup('password', playbook_dir ~ '/openldap_breakglass.password.txt chars=ascii_letters,digits length=24') | trim, true) }}"
    openldap_ssh_ldap_readonly_password: "{{ vault_openldap_ssh_ldap_readonly_password | default(lookup('password', playbook_dir ~ '/openldap_ssh_ldap_readonly.password.txt chars=ascii_letters,digits length=24') | trim, true) }}"
  roles:
    # Base system roles (all infra VMs)
    - { role: os_config, tags: ["system", "os_config"] }
    - { role: repos, tags: ["system", "repos"] }
    - { role: misc-base, tags: ["system", "misc-base"] }
    - { role: vim, tags: ["system", "vim"] }
    - { role: zsh, tags: ["system", "zsh"] }
    - { role: hosts_entries, tags: ["system", "hosts"] }

    # DNS VM (infra_dns): BIND + DNSCherry
    - role: bind_dns
      when: "'infra_dns' in group_names"
      tags: ["infra", "dns", "bind_dns"]
      vars:
        bind_dns_tsig_secret: "{{ vault_bind_dns_tsig_secret | default(lookup('file', playbook_dir ~ '/dns_tsig_secret.txt') | trim, true) }}"
    - role: dnscherry
      when: "'infra_dns' in group_names"
      tags: ["infra", "dns", "dnscherry"]
      vars:
        bind_dns_tsig_secret: "{{ vault_bind_dns_tsig_secret | default(lookup('file', playbook_dir ~ '/dns_tsig_secret.txt') | trim, true) }}"
        dnscherry_nginx_ssl_letsencrypt: false

    # LDAP VM (infra_ldap): OpenLDAP + ldapcherry + SSH-via-LDAP
    - { role: openldap, when: "'infra_ldap' in group_names", tags: ["infra", "ldap", "openldap"] }
    - role: ldapcherry
      when: "'infra_ldap' in group_names"
      tags: ["infra", "ldap", "ldapcherry"]
      vars:
        ldapcherry_nginx_ssl_letsencrypt: false
    - { role: ssh_ldap, when: "'infra_ldap' in group_names", tags: ["infra", "ldap", "ssh_ldap"] }

    # Ansible master VM (infra_ansible_master): wildcard cert via OVH DNS-01.
    # The `users` role is intentionally not applied (see header).
    - role: certbot_letsencrypt
      when: "'infra_ansible_master' in group_names"
      tags: ["infra", "ansible-master", "certbot", "letsencrypt"]
      vars:
        certbot_letsencrypt_enable: true
        # Live cert directory is named after the cert_name (first -d).
        certbot_letsencrypt_cert_name: "int.kakwalab.ovh"
        # Wildcard covers only subdomains, so include the bare domain as well.
        certbot_letsencrypt_domains:
          - "int.kakwalab.ovh"
          - "*.int.kakwalab.ovh"
        certbot_letsencrypt_email: "{{ vault_letsencrypt_email | default('hostmaster@kakwalab.ovh') }}"
        certbot_letsencrypt_ovh_application_key: "{{ vault_docker_registry_ovh_application_key | default(lookup('file', playbook_dir ~ '/ovh_dns_application_key.txt') | trim, true) }}"
        certbot_letsencrypt_ovh_application_secret: "{{ vault_docker_registry_ovh_application_secret | default(lookup('file', playbook_dir ~ '/ovh_dns_application_secret.txt') | trim, true) }}"
        certbot_letsencrypt_ovh_consumer_key: "{{ vault_docker_registry_ovh_consumer_key | default(lookup('file', playbook_dir ~ '/ovh_dns_consumer_key.txt') | trim, true) }}"

    # Registry VM (infra_registry): cert for registry.int… + docker-registry.
    - role: certbot_letsencrypt
      when: "'infra_registry' in group_names"
      tags: ["infra", "registry", "certbot", "letsencrypt"]
      vars:
        certbot_letsencrypt_enable: true
        certbot_letsencrypt_cert_name: "registry.int.kakwalab.ovh"
        certbot_letsencrypt_domains:
          - "registry.int.kakwalab.ovh"
        certbot_letsencrypt_email: "{{ vault_letsencrypt_email | default('hostmaster@kakwalab.ovh') }}"
        certbot_letsencrypt_ovh_application_key: "{{ vault_docker_registry_ovh_application_key | default(lookup('file', playbook_dir ~ '/ovh_dns_application_key.txt') | trim, true) }}"
        certbot_letsencrypt_ovh_application_secret: "{{ vault_docker_registry_ovh_application_secret | default(lookup('file', playbook_dir ~ '/ovh_dns_application_secret.txt') | trim, true) }}"
        certbot_letsencrypt_ovh_consumer_key: "{{ vault_docker_registry_ovh_consumer_key | default(lookup('file', playbook_dir ~ '/ovh_dns_consumer_key.txt') | trim, true) }}"
    - role: docker_registry
      when: "'infra_registry' in group_names"
      tags: ["infra", "registry", "docker_registry"]
      vars:
        # docker_registry points its nginx at /etc/letsencrypt/live/<name>/ —
        # must match the certbot_letsencrypt entry above (no play-level var,
        # since the ansible-master pool uses a different cert name).
        certbot_letsencrypt_cert_name: "registry.int.kakwalab.ovh"
        docker_registry_nginx_ssl_enable: true
        docker_registry_nginx_ssl_letsencrypt: true
        docker_registry_auth_password: "{{ vault_docker_registry_password | default(lookup('password', playbook_dir ~ '/docker_registry.password.txt chars=ascii_letters,digits length=24') | trim, true) }}"
        docker_registry_http_secret: "{{ vault_docker_registry_http_secret | default(lookup('password', playbook_dir ~ '/docker_registry_http_secret.txt chars=ascii_letters,digits length=64') | trim, true) }}"
