---
# Inventory: hypervisor pool (the kvm host).
#
# The inventory is the `inventory/` directory: Ansible merges every *.yml
# file in it (see ansible.cfg). `infra.yml` in this directory is generated
# by OpenTofu (tofu/infra) and is overwritten on every `tofu apply`.
#
# The NIC -> IP mapping is per host under `static_ip_nics`; it is consumed by
# the `static_ip` role (see roles/static_ip/README.md). Each NIC carries its
# own address, gateway and DNS - there are no global network defaults.
all:
  vars:
    ansible_user: kakwa
  children:
    hypervisor:
      hosts:
        kvm:
          ansible_host: 192.168.1.30
          # Proxmox "projects": one pool + user + API token each (proxmox_pools
          # role). Credentials are generated on the controller in
          # ansible/pve_pools/ (<user>.password, <user>.token, gitignored) and
          # copied to /root/pve-credentials on the host.
          pve_pools:
            - name: pocs
              user: pocs
              quota:
                max_vms: 10
                max_cpu: 20
                max_ram_gb: 16
                max_disk_gb: 512
            - name: k8s
              user: k8s
              quota:
                max_vms: 20
                max_ram_gb: 32
                max_disk_gb: 1024
            - name: infra
              user: infra
              quota:
                max_vms: 5
                max_ram_gb: 8
                # dns/ldap/ansible-master: 3 x 30 GB + registry: 200 GB
                max_disk_gb: 320
          # Publish the static address immediately, before facts are refreshed
          # after a network change.
          avahi_lan_ip: 192.168.1.30
          # The static_ip / PVE installer manage vmbr0 (nic0); do not let the
          # proxmox role write a second stanza into /etc/network/interfaces.
          pve_configure_bridge: false
          # nic1/nic2 are dedicated, IP-less bridges for VM traffic to the
          # outside (the hypervisor itself has no address on them).
          pve_additional_bridges:
            - name: vmbr1
              ports: nic1
            - name: vmbr2
              ports: nic2
          # TODO: fill in the NIC name once known. On PVE this is usually the
          # bridge (vmbr0) rather than the physical port:
          #   static_ip_nics:
          #     vmbr0:
          #       address: 192.168.1.30/24
          #       gateway: 192.168.1.254
          #       dns: [192.168.1.25]
          #       bridge_ports: [enp9s0]   # replace with the real NIC
          static_ip_nics:
            enp3s0:
              address: 192.168.1.30/24
              gateway: 192.168.1.254
              dns:
                - 192.168.1.254
