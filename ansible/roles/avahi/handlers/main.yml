---
# Handlers for avahi operations

- name: restart avahi-daemon
  systemd:
    name: avahi-daemon
    state: restarted

- name: reload avahi-daemon
  systemd:
    name: avahi-daemon
    state: reloaded

- name: restart avahi-publish units
  systemd:
    name: "avahi-publish-{{ item }}.service"
    state: restarted
  loop: "{{ avahi_additional_hostnames }}"



