---
- name: restart dnscherry
  # systemd_service + daemon_reload: the role drops a KillMode override into
  # dnscherry.service.d/, which systemd must see before the restart.
  ansible.builtin.systemd_service:
    name: dnscherry
    state: restarted
    daemon_reload: true

- name: reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
