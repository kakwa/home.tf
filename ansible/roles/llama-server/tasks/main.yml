---
# llama-server role tasks
#
# Order matters: packages -> service user/dirs -> models -> env + drop-in ->
# in-flight guard -> flush handlers (restart) -> start -> health -> nginx.

- name: Fail on unknown llama_server_backend
  ansible.builtin.assert:
    that:
      - llama_server_backend in ['rocm', 'vulkan']
    fail_msg: >-
      llama_server_backend must be "rocm" or "vulkan" (got "{{ llama_server_backend }}").

- name: Resolve GGML backend package and device name
  ansible.builtin.set_fact:
    llama_server_backend_package: >-
      {{ 'libggml0-backend-hip' if llama_server_backend == 'rocm' else 'libggml0-backend-vulkan' }}
    llama_server_backend_device: >-
      {{ 'ROCm0' if llama_server_backend == 'rocm' else 'Vulkan0' }}

- name: Install llama.cpp packages
  ansible.builtin.apt:
    name:
      - llama.cpp
      - llama.cpp-services
      - curl
      - ca-certificates
      - llama.cpp-svelte-ui
      - "{{ llama_server_backend_package }}"
    state: present
    update_cache: true
    install_recommends: false

- name: Stat llama-server systemd unit
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/lib/systemd/system/llama-server.service
    - /lib/systemd/system/llama-server.service
  register: ls_unit_stats

- name: Verify backend device is visible to llama.cpp
  ansible.builtin.command: llama-server --list-devices
  register: ls_devices
  check_mode: false
  changed_when: false
  failed_when: false

- name: Fail if {{ llama_server_backend_device }} is not listed
  ansible.builtin.assert:
    that:
      - (ls_devices.stdout | default('')) is search(llama_server_backend_device)
    fail_msg: >-
      llama-server does not see {{ llama_server_backend_device }}; check the
      {{ llama_server_backend }} backend packages and GPU drivers.
      Output was: {{ ls_devices.stdout | default('<no output>') }}

- name: Ensure llama-server service user exists
  ansible.builtin.user:
    name: "{{ llama_server_service_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Ensure model directory exists
  ansible.builtin.file:
    path: "{{ llama_server_model_dir }}"
    state: directory
    owner: "{{ llama_server_service_user }}"
    group: "{{ llama_server_service_user }}"
    mode: "0755"

- name: Build list of model files to ensure
  ansible.builtin.set_fact:
    llama_server_model_files: >-
      {{
        [{ 'name': llama_server_quants[llama_server_quant].file,
           'sha256': llama_server_quants[llama_server_quant].sha256,
           'bytes': llama_server_quants[llama_server_quant].bytes }]
        + ([{ 'name': llama_server_mmproj.file,
              'sha256': llama_server_mmproj.sha256,
              'bytes': llama_server_mmproj.bytes }]
           if llama_server_vision | bool else [])
      }}

- name: Ensure model files are present and SHA-256 verified
  ansible.builtin.include_tasks: ensure_model_file.yml
  loop: "{{ llama_server_model_files }}"
  loop_control:
    label: "{{ item.name }}"

# ---------------------------------------------------------------------------
# GPU overclocking (amdgpu overdrive, see defaults for the values)
# ---------------------------------------------------------------------------
# The pp_od sysfs interface only exists once the amdgpu.ppfeaturemask kernel
# argument is active (reboot required), so the unit carries a
# ConditionPathExists and the immediate-apply steps below are guarded on the
# interface being present.

- name: Read /etc/default/grub
  ansible.builtin.slurp:
    src: /etc/default/grub
  register: ls_grub_src
  when: llama_server_gpu_oc_enable | bool

- name: Parse current GRUB_CMDLINE_LINUX_DEFAULT
  ansible.builtin.set_fact:
    ls_grub_cmdline_current: >-
      {{
        (ls_grub_src.content | b64decode).splitlines()
        | select('match', '^GRUB_CMDLINE_LINUX_DEFAULT=')
        | first | default('')
        | regex_replace('^GRUB_CMDLINE_LINUX_DEFAULT=', '')
        | trim
        | regex_replace('^"|"$', '')
      }}
  when: llama_server_gpu_oc_enable | bool

- name: Compute desired GRUB_CMDLINE_LINUX_DEFAULT
  ansible.builtin.set_fact:
    ls_grub_oc_arg: "amdgpu.ppfeaturemask={{ llama_server_gpu_oc_ppfeaturemask }}"
  when: llama_server_gpu_oc_enable | bool

- name: Compute desired GRUB_CMDLINE_LINUX_DEFAULT value
  ansible.builtin.set_fact:
    ls_grub_cmdline_desired: >-
      {{ (ls_grub_cmdline_current.split()
          + ([ls_grub_oc_arg] if ls_grub_oc_arg not in ls_grub_cmdline_current.split() else []))
         | join(' ') }}
  when: llama_server_gpu_oc_enable | bool

- name: Ensure amdgpu.ppfeaturemask is set in GRUB_CMDLINE_LINUX_DEFAULT
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
    line: 'GRUB_CMDLINE_LINUX_DEFAULT="{{ ls_grub_cmdline_desired }}"'
  when: llama_server_gpu_oc_enable | bool
  notify: update grub

- name: Stat amdgpu overdrive interface
  ansible.builtin.stat:
    path: "{{ llama_server_gpu_oc_device }}/pp_od_clk_voltage"
  register: ls_od_stat
  when: llama_server_gpu_oc_enable | bool

# Deployed before the script so the "Reload systemd" handler (notified here)
# is queued before "Apply GPU overclock" (notified below): handlers run in
# notification order, and the restart must see the freshly reloaded unit.
- name: Deploy GPU OC systemd unit
  ansible.builtin.template:
    src: llama-server-gpu-oc.service.j2
    dest: "/etc/systemd/system/{{ llama_server_gpu_oc_unit }}"
    mode: "0644"
  when: llama_server_gpu_oc_enable | bool
  notify: Reload systemd

- name: Ensure GPU OC script directory
  ansible.builtin.file:
    path: "{{ llama_server_gpu_oc_script | dirname }}"
    state: directory
    mode: "0755"
  when: llama_server_gpu_oc_enable | bool

- name: Deploy GPU OC script
  ansible.builtin.template:
    src: llama-server-gpu-oc.sh.j2
    dest: "{{ llama_server_gpu_oc_script }}"
    mode: "0755"
  when: llama_server_gpu_oc_enable | bool
  notify: Apply GPU overclock

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Enable GPU OC service
  ansible.builtin.systemd:
    name: "{{ llama_server_gpu_oc_unit }}"
    enabled: true
  when: llama_server_gpu_oc_enable | bool

- name: Start GPU OC service (overdrive interface available)
  ansible.builtin.systemd:
    name: "{{ llama_server_gpu_oc_unit }}"
    state: started
  when:
    - llama_server_gpu_oc_enable | bool
    - ls_od_stat.stat.exists | default(false)
