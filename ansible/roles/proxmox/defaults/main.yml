---
# Proxmox VE host setup defaults.
# Repository layout follows https://pve.proxmox.com/wiki/Package_Repositories

# Proxmox publishes pve-no-subscription only for bookworm/bullseye/trixie.
# There is no forky repository: forcing an unsupported suite requires
# pve_allow_unsupported_suite: true and a repo you provide yourself.
pve_suite: trixie
pve_supported_suites:
  - bookworm
  - bullseye
  - trixie
pve_allow_unsupported_suite: false

# deb822 source written to /etc/apt/sources.list.d/proxmox.sources
pve_repo_name: proxmox
pve_repo_uri: "http://download.proxmox.com/debian/pve"
pve_repo_component: pve-no-subscription

# Keyring for the trixie-based releases (sha256 from the Proxmox wiki).
# Override the URL and checksum if you pin an older suite.
pve_keyring_url: "https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg"
pve_keyring_path: "/usr/share/keyrings/proxmox-archive-keyring.gpg"
pve_keyring_checksum: "sha256:136673be77aba35dcce385b28737689ad64fd785a797e57897589aed08db6e45"

# A fresh PVE install enables the subscription-only enterprise repo.
pve_disable_enterprise_repo: true
pve_enterprise_repo_files:
  - /etc/apt/sources.list.d/pve-enterprise.sources
  - /etc/apt/sources.list.d/pve-enterprise.list

# proxmox-ve is the metapackage pulling in the kernel, pve-manager,
# qemu-server and pve-container.
pve_packages:
  - proxmox-ve
  - postfix
  - pve-firmware
# chrony is intentionally not listed: the misc-base role installs
# systemd-timesyncd, and the two NTP daemons conflict with each other.
pve_mailname: "{{ ansible_facts['fqdn'] | default(inventory_hostname) }}"

pve_services:
  - pve-cluster
  - pvedaemon
  - pveproxy
  - pvestatd
  - pvescheduler

# Nested virtualization needs a reboot after the modprobe file changes.
pve_nested_virtualization: true
pve_kvm_modprobe_file: /etc/modprobe.d/qemu-system-x86.conf

# PVE installed from the ISO already creates vmbr0. Enable this only when
# setting PVE up on a plain Debian host and you want Ansible to create it.
pve_configure_bridge: false
pve_bridge_name: vmbr0
pve_bridge_physical_interface: enp9s0

# Additional IP-less bridges used purely as VM NICs (the host itself gets no
# address on them). Each entry needs a bridge name and its physical port(s).
pve_additional_bridges: []
# pve_additional_bridges:
#   - name: vmbr1
#     ports: nic1
