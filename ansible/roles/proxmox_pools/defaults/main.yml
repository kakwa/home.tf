---
# Proxmox pools / users / API tokens ("projects").
#
# Each entry in pve_pools is one project: a PVE pool, a user (account) and an
# API token, with the user granted pve_pools_default_role on its own pool.
#
# Secrets: the user password is generated on the controller (first run only)
# via lookup('password') and persisted in pve_pools_secrets_dir/<user>.password;
# the token secret is generated by PVE at token creation (PVE 9 has no
# password option for tokens) and written to
# pve_pools_secrets_dir/<user>.token after the create call. Both are 0600,
# owned by the controller user, gitignored, then copied to pve_pools_dir on
# the PVE host (0600, root-owned). Use them wherever the credentials are
# needed, e.g. Terraform's bpg/proxmox provider (user + token file).

# Realm of the created users. 'pve' is the local internal realm.
pve_pools_realm: pve

# One entry per project. name = pool id, user = account (user@realm), token =
# API token name (user@realm!token), role = ACL role granted on the pool.
pve_pools: []
# pve_pools:
#   - name: pocs
#     user: pocs
#     token: token
#     role: PVEVMAdmin
#   - name: k8s
#     user: k8s
#     token: token
#     role: PVEVMAdmin

# ACL role granted on each pool to its user (and, since PVE 9, to its token as
# well - see pve_pools_aux_grants for why). PVEPoolAdmin carries the Pool.*
# privileges, which lets the project account read and modify its own pool via
# API and UI (PVEVMAdmin on the pool path lacks Pool.Audit, so the pool is
# invisible to the account). VM operations are covered by the /vms aux grant
# (PVEVMAdmin). See https://pve.proxmox.com/wiki/Access_Control
pve_pools_default_role: PVEPoolAdmin

# PVE node id, used for node-scoped grants (e.g. Sys.AccessNetwork for
# downloading OS images by URL).
pve_pools_node: pve

# Auxiliary ACL grants, applied to BOTH the user and the token of every pool,
# in addition to the pool role. These are the extra permissions the bpg/proxmox
# provider needs to provision a VM end to end:
#   - create/configure/start/stop/destroy VMs: the pool grant on /pool/<id>
#     does NOT cover the VM paths - PVE pools are purely organizational and
#     do not propagate ACLs. VM operations check /vms/<vmid>, so the pool
#     role is granted on /vms (the parent of every VM path) as well.
#   - download an OS image: Datastore.AllocateTemplate on the dir storage
#     (PVEDatastoreAdmin) + Sys.AccessNetwork on the node (custom role; no
#     built-in role carries that privilege)
#   - allocate the VM disk: Datastore.AllocateSpace on the thin storage
#     (PVEDatastoreUser)
#   - attach the VM to a bridge: SDN.Use on the localnetwork zone path
#     (PVESDNUser)
#
# WHY both user AND token: PVE 9 tokens default to privsep:1, and a privsep
# token's effective permissions on a path are the *intersection* of the grants
# on the token and the grants on its owning user (PVE::RPCEnvironment,
# compile_acl_path). Granting only the user - the old behaviour - therefore
# left the token with an empty permission set, so every API call 403'd.
#
# Each entry is { path, role }. An entry may also carry `privs` (a list of
# privilege names) which makes the role be created with exactly those
# privileges if it does not already exist (required for Sys.AccessNetwork,
# which no built-in role carries).
#
# The same list applies to every pool (they share the host's storage and
# bridges); scope it down by editing this variable.
pve_pools_aux_grants:
  # /vms covers every VM path (/vms/<vmid>); pool grants do not propagate to
  # them (see above). Scope this down to individual VM ids if the pool account
  # should not be able to manage VMs outside its pool.
  - { path: /vms, role: PVEVMAdmin }
  - { path: /storage/local, role: PVEDatastoreAdmin }
  - { path: /storage/local-lvm, role: PVEDatastoreUser }
  - { path: /sdn/zones/localnetwork/vmbr2, role: PVESDNUser }
  # NOTE: PVE reserves the 'PVE' role-id namespace (case-insensitive) for
  # built-in roles, so custom role ids must not start with 'PVE'.
  - { path: "/nodes/{{ pve_pools_node }}", role: AccessNetwork, privs: [Sys.AccessNetwork] }

# Per-pool quotas. PVE pools have no native resource quotas (they are
# permission groupings), so the role audits them instead: each entry in
# pve_pools may carry a quota with any of:
#   max_vms:     max number of VMs in the pool
#   max_cpu:     max sum of allocated CPU cores (cores * sockets)
#   max_ram_gb:  max sum of allocated memory in GB
#   max_disk_gb: max sum of provisioned disk size in GB
# Usage is measured from the VMs' allocated (configured) resources, not live
# usage. An exceeded quota is reported every run; with
# pve_pools_quota_enforce: true it fails the play instead.
pve_pools_quota_enforce: false

# Where the pool-usage helper script is installed on the host.
pve_pools_quota_dir: /usr/local/sbin
pve_pools_quota_usage_script: /usr/local/sbin/pve-pool-usage

# Pre-start hook (admission control): blocks VM start and migrate on the host
# when starting a VM would push its pool over the CPU or RAM quota. Only CPU
# and RAM are enforced here - disk sizes are reservations, not usage, and VM
# counts are covered by the audit.
# Note: on PVE 9 the /etc/pve directory may be backed by pmxcfs (the
# "pve-cluster" FUSE filesystem), which rejects chmod and forces created
# files to 0640 - an executable hook cannot live there. The role probes for
# this and skips the hook (with a warning) in that case; the audit above
# still runs and pve_pools_quota_enforce can fail the play on excess.
pve_pools_quota_hook: true
pve_pools_quota_hook_file: /etc/pve/hooks/pre-start
# Machine-readable quota config consumed by the hook (rendered by this role).
pve_pools_quota_conf: /etc/pve/pool-quotas.conf

# Controller-side directory where lookup('password') persists the generated
# secrets (gitignored). Files: <user>.password, <user>.token.
pve_pools_secrets_dir: "{{ playbook_dir }}/pve_pools"

# Where the generated credential files are copied on the PVE host.
pve_pools_dir: /root/pve-credentials
