---
# SSH daemon and root authorized_keys for the physical hosts.
# Direct root login over SSH is disabled: use a normal account + sudo.
ssh_permit_root_login: "no"

# Drop-in locations. The old filename is removed so two conflicting
# PermitRootLogin directives cannot coexist.
ssh_permit_root_login_conf: /etc/ssh/sshd_config.d/99-root-login.conf
ssh_permit_root_login_conf_deprecated: /etc/ssh/sshd_config.d/99-allow-root.conf
