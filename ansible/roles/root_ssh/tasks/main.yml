---
- name: Ensure sshd_config.d exists
  file:
    path: /etc/ssh/sshd_config.d
    state: directory
    mode: '0755'

- name: Remove deprecated root-login drop-in
  ansible.builtin.file:
    path: "{{ ssh_permit_root_login_conf_deprecated }}"
    state: absent
  notify: restart ssh

- name: Configure PermitRootLogin
  ansible.builtin.copy:
    content: |
      PermitRootLogin {{ ssh_permit_root_login }}
    dest: "{{ ssh_permit_root_login_conf }}"
    mode: '0644'
  notify: restart ssh
