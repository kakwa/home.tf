---
# ai-power: Wake-on-LAN + idle suspend for the physical ai.local host
#
# The host runs llama-server directly on 127.0.0.1:8080 (see llama-server
# role). This role:
#   1. Persists Wake-on-LAN (ethtool wol) on the configured NICs via a udev
#      rule, so the host can be woken remotely (magic packet from the
#      NetBSD proxy, see netbsd-waker role).
#   2. Installs ai-power-monitor.service, a python3 daemon that polls
#      llama-server's /metrics endpoint and suspends the host after
#      ai_power_idle_timeout seconds without activity.
#
# NOTE: BIOS "Wake on LAN" / "Power on by PCI-E" must be enabled manually.

# NICs to enable Wake-on-LAN on (matched by kernel name in the udev rule).
ai_power_wol_nics:
  - enp4s0f0
  - enp9s0

# ethtool wol flags: "g" = magic packet (unicast).
ai_power_wol_flags: g

# Sleep mode used when idle. Two families:
#   Raw /sys/power/state values (written directly, no systemd-sleep):
#     standby - S1 CPU idle, peripherals stay powered (WOL works out of
#               the box, no BIOS/firmware sleep state needed)
#     mem     - S3 suspend-to-RAM (same as "systemctl suspend")
#     disk    - S4 suspend-to-disk (hibernate)
#     freeze  - freeze processes only, no hardware sleep
#   systemd-level (issued via "systemctl <mode>"):
#     suspend, hibernate, hybrid-sleep, suspend-then-hibernate
ai_power_sleep_mode: standby

# Stop llama-server before sleeping and restart it after wake. Freeing the
# GPU's pinned model buffers makes suspend/resume fast and avoids the
# amdgpu/KFD resume OOM that happens when the model is loaded (see
# report.md). Set to false to leave llama-server running across sleep
# (not recommended on this host).
ai_power_stop_llama_on_sleep: true

# The systemd unit to stop/start around each sleep cycle.
ai_power_llama_service: llama-server.service

# How long to wait for that unit to become fully inactive (no processes left
# in its cgroup) before sleeping, in seconds. The model unload / GPU flush can
# take a while. If the timeout expires the monitor sends SIGKILL to the
# remaining processes and waits ai_power_llama_stop_kill_grace more seconds;
# if the unit still is not completely down it refuses to sleep and restarts
# llama-server instead.
ai_power_llama_stop_timeout: 120
# How often to re-check the unit while waiting for it to stop, in seconds.
ai_power_llama_stop_poll_interval: 1
# Extra time to wait after the SIGKILL escalation, in seconds.
ai_power_llama_stop_kill_grace: 10

# Memory sleep mode used for "suspend" (written to /sys/power/mem_sleep by
# systemd before suspending). On this host "deep" needs minutes to enter and
# leave due to a failing freezer step and an amdgpu/KFD resume error, so the
# default is "s2idle" (suspend-to-idle):
#   s2idle  - suspend-to-idle, CPU enters idle states, fastest wake
#   shallow - S0ix/standby-like state, if the firmware supports it
#   deep    - suspend-to-RAM (S3), slowest and broken on this host
# Set to an empty string to leave the kernel's default mode untouched.
ai_power_mem_sleep: s2idle

# Suspend when llama-server has been idle for this long (seconds).
# 900 = 15 minutes.
ai_power_idle_timeout: 900

# llama-server metrics endpoint (http server, localhost only).
ai_power_metrics_url: http://127.0.0.1:8080/metrics

# How often to poll the metrics endpoint (seconds).
ai_power_poll_interval: 30

# How often to log a state dump with the sleep countdown (seconds).
# 0 = log on every poll.
ai_power_status_log_interval: 30

# State dir/file for the activity baseline (survives suspend/resume).
ai_power_state_dir: /var/lib/ai-power

# Where the monitor script lives.
ai_power_lib_dir: /usr/local/lib/ai-power

# Python interpreter used by the monitor.
ai_power_python: /usr/bin/python3
