---
# Skipped when the unit file is not on disk (first check-mode run: the
# template that would create it is a no-op, so the service cannot be
# looked up). The register is set by the "Check whether ai-power-monitor
# unit exists" task, which always runs before handlers in this play.
- name: Restart ai-power monitor
  ansible.builtin.systemd:
    name: ai-power-monitor
    state: restarted
  when: ai_power_unit_stat.stat.exists
