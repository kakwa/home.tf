---
# ai-power role tasks
#
# Order: packages -> state dir -> udev rule (WOL) -> monitor script + unit ->
# apply WOL now (runtime) -> enable + start monitor.

- name: Install python3 and ethtool
  ansible.builtin.apt:
    name:
      - python3
      - ethtool
    state: present
    update_cache: true
    install_recommends: no

- name: Create state directory
  ansible.builtin.file:
    path: "{{ ai_power_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create monitor script directory
  ansible.builtin.file:
    path: "{{ ai_power_lib_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Fail on unknown ai_power_mem_sleep mode
  ansible.builtin.assert:
    that:
      - ai_power_mem_sleep in ['', 's2idle', 'shallow', 'deep']
    fail_msg: >-
      ai_power_mem_sleep must be "s2idle", "shallow", "deep" or empty
      (got "{{ ai_power_mem_sleep }}").

- name: Create systemd sleep.conf drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/sleep.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# systemd-sleep reads this drop-in on every suspend, so no daemon reload is
# needed; the next `systemctl suspend` picks the new mode up automatically.
- name: Configure systemd suspend memory sleep mode
  ansible.builtin.template:
    src: ai-power-sleep.conf.j2
    dest: /etc/systemd/sleep.conf.d/90-ai-power.conf
    owner: root
    group: root
    mode: "0644"

- name: Write Wake-on-LAN udev rule
  ansible.builtin.template:
    src: ai-power-wol.rules.j2
    dest: /etc/udev/rules.d/90-ai-power-wol.rules
    owner: root
    group: root
    mode: "0644"

- name: Write idle sleep monitor script
  ansible.builtin.template:
    src: ai-power-monitor.py.j2
    dest: "{{ ai_power_lib_dir }}/monitor.py"
    owner: root
    group: root
    mode: "0755"
  notify: Restart ai-power monitor

- name: Write ai-power monitor systemd unit
  ansible.builtin.template:
    src: ai-power-monitor.service.j2
    dest: /etc/systemd/system/ai-power-monitor.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart ai-power monitor

# Runtime setting for the current boot; the udev rule covers reboots.
# never reports changed (ethtool -s is a no-op when already set).
- name: Apply Wake-on-LAN settings now
  ansible.builtin.command:
    cmd: /usr/sbin/ethtool -s {{ item }} wol {{ ai_power_wol_flags }}
  loop: "{{ ai_power_wol_nics }}"
  changed_when: false
  failed_when: false

# In check mode the unit template above does not write the file, so on a
# first run the unit is not on disk yet and the systemd module's service
# lookup fails with "Could not find the requested service". Only manage the
# service when its unit file is actually present. In real mode the template
# task has just written it, so this is always true there.
- name: Check whether ai-power-monitor unit exists
  ansible.builtin.stat:
    path: /etc/systemd/system/ai-power-monitor.service
  register: ai_power_unit_stat

- name: Enable and start ai-power monitor
  ansible.builtin.systemd:
    name: ai-power-monitor
    enabled: true
    state: started
    daemon_reload: true
  when: ai_power_unit_stat.stat.exists
